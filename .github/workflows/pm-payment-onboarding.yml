name: Property Management payment onboarding safety

on:
  pull_request:
    paths:
      - "pm_payments/**"
      - "user_accounts/viewsets/pm_rent.py"
      - "user_accounts/viewsets/stripe_connect.py"
      - "syncworksv7/settings.py"
      - "syncworksv7/urls.py"
      - ".github/workflows/pm-payment-onboarding.yml"
  push:
    branches: [feature/pm-payment-onboarding-20261029]
    paths:
      - "pm_payments/**"
      - "user_accounts/viewsets/pm_rent.py"
      - "user_accounts/viewsets/stripe_connect.py"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate Django setup and apply migrations
        run: |
          python -m compileall -q pm_payments user_accounts/viewsets/pm_rent.py user_accounts/viewsets/stripe_connect.py
          python manage.py check
          python manage.py migrate --noinput
      - name: Test isolated account configuration and block unsafe rent charges
        run: python manage.py test pm_payments.tests --verbosity 2
