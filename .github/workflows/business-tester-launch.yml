name: Business Tester Launch checks

on:
  pull_request:
    paths:
      - "user_accounts/viewsets/password_recovery.py"
      - "user_accounts/viewsets/platform_business_prospects.py"
      - "user_accounts/models/platform_business_prospects.py"
      - "user_accounts/urls.py"
      - "user_accounts/migrations/0137_business_pilot_tracking.py"
      - "user_accounts/tests/test_password_recovery.py"
      - "user_accounts/tests/test_platform_tester_launch.py"
      - "syncworksv7/settings.py"
      - ".github/workflows/business-tester-launch.yml"
  push:
    branches: [feature/business-tester-readiness-20261029, main]
    paths:
      - "user_accounts/viewsets/password_recovery.py"
      - "user_accounts/viewsets/platform_business_prospects.py"
      - "user_accounts/models/platform_business_prospects.py"
      - "user_accounts/urls.py"
      - "user_accounts/migrations/0137_business_pilot_tracking.py"
      - "user_accounts/tests/test_password_recovery.py"
      - "user_accounts/tests/test_platform_tester_launch.py"

jobs:
  launch-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate framework and migrations
        run: |
          python -m compileall -q user_accounts/viewsets/password_recovery.py user_accounts/viewsets/platform_business_prospects.py
          python manage.py check
          python manage.py migrate --noinput
      - name: Run password and God Mode pilot tests
        run: python manage.py test user_accounts.tests.test_password_recovery user_accounts.tests.test_platform_tester_launch --verbosity 2
