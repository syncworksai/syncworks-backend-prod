name: SyncWorks Property Management CI

on:
  pull_request:
    paths:
      - "pm_workspace/**"
      - "syncworksv7/urls.py"
      - ".github/workflows/pm-workspace-ci.yml"
  workflow_dispatch:

jobs:
  property-management-checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-property-management-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Run Property Management tests
        run: python manage.py test pm_workspace.tests -v 2
