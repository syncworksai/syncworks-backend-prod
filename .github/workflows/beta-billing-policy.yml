name: Beta billing safeguards
on:
  pull_request:
    paths:
      - "user_accounts/services/cash_fee_*.py"
      - "user_accounts/services/marketplace_payment_policy.py"
      - "user_accounts/viewsets/auth.py"
      - "user_accounts/viewsets/promo.py"
      - "user_accounts/viewsets/cash_fee_invoices.py"
      - "user_accounts/serializers/promo.py"
      - "user_accounts/models/cash_fee_invoice.py"
      - "user_accounts/migrations/0138_cash_fee_reminder_tracking.py"
      - "user_accounts/tests/test_beta_cash_fee_policy.py"
      - ".github/workflows/beta-billing-policy.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test user_accounts.tests.test_beta_cash_fee_policy user_accounts.tests.test_all_subscription_waiver user_accounts.tests.test_marketplace_payment_policy --verbosity 2
