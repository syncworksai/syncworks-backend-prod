name: Business Finance checks

on:
  push:
    branches:
      - feature/business-finance-intelligence-20261024
      - main
    paths:
      - "business_finance/**"
      - "syncworksv7/settings.py"
      - "syncworksv7/urls.py"
      - ".github/workflows/business-finance.yml"
  pull_request:
    paths:
      - "business_finance/**"
      - "syncworksv7/settings.py"
      - "syncworksv7/urls.py"

jobs:
  finance-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Django requirements
        run: python -m pip install -r requirements.txt
      - name: Validate syntax and migrations
        run: |
          python -m compileall -q business_finance
          python manage.py check
          python manage.py migrate --noinput
      - name: Run Finance API tests
        run: python manage.py test business_finance --verbosity 2
