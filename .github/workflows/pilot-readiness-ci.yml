name: God Mode Pilot Readiness CI

on:
  pull_request:
    paths:
      - "user_accounts/viewsets/platform_pilot_readiness.py"
      - "user_accounts/tests/test_platform_pilot_readiness.py"
      - "user_accounts/urls.py"
      - ".github/workflows/pilot-readiness-ci.yml"
  workflow_dispatch:

jobs:
  pilot-readiness-checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: pilot-readiness-ci-only
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django security/system check
        run: python manage.py check
      - name: Founder-only evidence tests
        run: python manage.py test user_accounts.tests.test_platform_pilot_readiness -v 2
