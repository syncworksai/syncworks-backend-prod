name: EDGE v2.2 CFB Only

on:
  push:
    branches:
      - agent/edge-v22-cfb-only
    paths:
      - scripts/edge_v22_cfb_only.py
      - .github/workflows/edge-v22-cfb-only.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run CFB state-aware discovery
        env:
          EDGE_DAYS: '420'
          EDGE_MAX_EVENTS: '90'
        run: python scripts/edge_v22_cfb_only.py
      - uses: actions/upload-artifact@v4
        with:
          name: edge-v22-cfb-results
          path: edge_v22_cfb_results.json
          retention-days: 90
