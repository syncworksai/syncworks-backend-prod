name: Forge Narrator CI

on:
  pull_request:
    paths:
      - "customer_health/forge_voice_views.py"
      - "customer_health/test_forge_voice.py"
      - ".github/workflows/forge-narrator-ci.yml"
  workflow_dispatch:

jobs:
  forge-narrator-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: forge-narrator-ci-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test customer_health.test_forge_voice -v 2
