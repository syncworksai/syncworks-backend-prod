name: EDGE v1.0 Strategy Discovery Research

on:
  push:
    branches:
      - agent/edge-v10-strategy-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run 120-day strategy discovery with final untouched holdout
        env:
          EDGE_DAYS: '120'
        run: python scripts/edge_v10_strategy_discovery.py | tee edge_v10_console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edge-v10-results
          path: |
            edge_v10_results.json
            edge_v10_final_holdout_replays.json
            edge_v10_console.txt
          retention-days: 14
