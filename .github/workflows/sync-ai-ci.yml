name: SyncWorks SYNC AI CI

on:
  pull_request:
    paths:
      - "sync_ai/**"
      - "customer_health/models.py"
      - "user_accounts/services/finance_intelligence.py"
      - "user_accounts/services/sync_alerts.py"
      - "user_accounts/services/sync_alert_operational_sources.py"
      - "user_accounts/viewsets/notifications.py"
      - "user_accounts/tests/test_sync_alerts.py"
      - "user_accounts/tests/test_sync_alert_operational_sources.py"
      - "personal_calendar/runtime_views.py"
      - "syncworksv7/urls.py"
      - ".github/workflows/sync-ai-ci.yml"
  workflow_dispatch:

jobs:
  sync-ai-checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-sync-ai-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Verify touched-app migrations
        run: python manage.py makemigrations customer_health user_accounts --check --dry-run
      - name: Run SYNC integration and alert tests
        run: python manage.py test sync_ai user_accounts.tests.test_sync_alerts user_accounts.tests.test_sync_alert_operational_sources -v 2
