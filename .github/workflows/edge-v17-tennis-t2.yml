name: EDGE v1.7 Tennis T2 State

on:
  push:
    branches:
      - agent/edge-v17-tennis-t2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run tennis T2 state-enriched discovery
        env:
          EDGE_DAYS: '120'
          EDGE_MAX_EVENTS: '300'
        run: python scripts/edge_v17_tennis_t2_state.py | tee edge_v17_console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edge-v17-tennis-t2-results
          path: |
            edge_v17_tennis_t2_results.json
            edge_v17_console.txt
          retention-days: 14
