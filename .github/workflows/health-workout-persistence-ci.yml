name: Health Workout Persistence CI

on:
  push:
    branches:
      - health-workout-history-persistence

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-health-workout-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations customer_health --check --dry-run
      - run: python manage.py test customer_health.test_workout_persistence -v 2
