name: Business Customer CSV Import checks

on:
  pull_request:
    paths:
      - "user_accounts/viewsets/data_imports.py"
      - "user_accounts/tests/test_business_customer_import_safety.py"
      - ".github/workflows/business-customer-import.yml"
  push:
    branches: [main, feature/business-customer-import-safety-20261029]
    paths:
      - "user_accounts/viewsets/data_imports.py"
      - "user_accounts/tests/test_business_customer_import_safety.py"

jobs:
  import-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate import code
        run: |
          python -m compileall -q user_accounts/viewsets/data_imports.py
          python manage.py check
          python manage.py migrate --noinput
      - name: Run import permission and duplicate tests
        run: python manage.py test user_accounts.tests.test_business_customer_import_safety --verbosity 2
