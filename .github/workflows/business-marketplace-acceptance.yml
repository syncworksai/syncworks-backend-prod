name: Business marketplace acceptance
on:
  pull_request:
    paths:
      - 'user_accounts/tests/test_business_marketplace_beta_acceptance.py'
      - '.github/workflows/business-marketplace-acceptance.yml'
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        env:
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: test-only-not-for-production
        run: python manage.py check
      - name: Marketplace acceptance
        env:
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: test-only-not-for-production
        run: python manage.py test user_accounts.tests.test_business_marketplace_beta_acceptance --verbosity 2
