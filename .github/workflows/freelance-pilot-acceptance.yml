name: Freelance pilot backend acceptance
on:
  push:
    branches:
      - release/freelance-backend-acceptance-20261123
    paths:
      - "sync_ai/freelance*"
      - "sync_ai/test_freelance*"
      - "sync_ai/urls.py"
      - "user_accounts/models/freelance_synthetic_job.py"
      - "user_accounts/models/__init__.py"
      - "user_accounts/migrations/0139_freelance_synthetic_job.py"
      - ".github/workflows/freelance-pilot-acceptance.yml"
  pull_request:
    paths:
      - "sync_ai/freelance*"
      - "sync_ai/test_freelance*"
      - "sync_ai/urls.py"
      - "user_accounts/models/freelance_synthetic_job.py"
      - "user_accounts/migrations/0139_freelance_synthetic_job.py"
      - ".github/workflows/freelance-pilot-acceptance.yml"
jobs:
  django-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      FREELANCE_SYNTHETIC_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Compile, validate Django, and check migration drift
        run: |
          python -m compileall -q sync_ai user_accounts
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run isolated freelancer pilot tests
        run: |
          python manage.py test sync_ai.test_freelance_pilot sync_ai.test_freelance_synthetic_queue sync_ai.test_freelance_business_ledger --verbosity 2
