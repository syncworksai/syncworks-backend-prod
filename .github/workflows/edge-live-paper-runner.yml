name: EDGE Live Paper Runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake backend and run paper tick
        run: |
          curl --retry 3 --retry-delay 10 --max-time 90 -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            https://syncworks-api.onrender.com/api/v1/edge/system/paper/tick/
