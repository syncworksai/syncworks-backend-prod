name: SyncWorks Calendar Runtime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          response=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=syncworks-calendar-runtime")
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run due calendar syncs
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CALENDAR_RUNTIME_URL: ${{ vars.CALENDAR_RUNTIME_URL }}
        shell: bash
        run: |
          url="${CALENDAR_RUNTIME_URL:-https://syncworks-api.onrender.com/api/v1/personal-calendar/runtime/run/}"
          curl -fsS -X POST "$url" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json"
