name: Sprint 01 migration drift diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/sprint01-migration-drift.yml'
      - 'platform_edge/models.py'
      - 'platform_edge/migrations/**'
      - 'pm_payments/models.py'
      - 'pm_payments/migrations/**'
      - 'pm_workspace/**'
      - 'user_accounts/migrations/**'
  workflow_dispatch:
jobs:
  migration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system checks
        env: &django-env
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: migration-drift-diagnostic-only
        run: python manage.py check
      - name: Print proposed migrations without modifying database
        env: *django-env
        run: python manage.py makemigrations platform_edge pm_payments pm_workspace --dry-run --verbosity 3
      - name: Enforce no unrecorded schema changes
        env: *django-env
        run: python manage.py makemigrations --check --dry-run

  fresh-postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: syncworks_test
          POSTGRES_USER: syncworks
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncworks -d syncworks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: migration-test-only
      DB_ENGINE: postgres
      POSTGRES_DB: syncworks_test
      POSTGRES_USER: syncworks
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply all migrations to isolated disposable Postgres
        run: python manage.py migrate --noinput
      - name: Check model consistency against migration history
        run: python manage.py makemigrations --check --dry-run
      - name: Validate PM application endpoints against PostgreSQL
        run: python manage.py test pm_workspace.tests.test_pm_application_pilot --noinput -v 2
