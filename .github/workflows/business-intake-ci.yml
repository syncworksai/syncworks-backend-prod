name: SyncWorks Business Intake CI
on:
  push:
    branches: [main]
    paths:
      - "user_accounts/viewsets/business_quick_intake.py"
      - "user_accounts/viewsets/quick_intake_slots.py"
      - "user_accounts/viewsets/customer_connection.py"
      - "user_accounts/viewsets/technician_workflow.py"
      - "user_accounts/services/business_calendar_sync.py"
      - "user_accounts/services/personal_calendar_sync.py"
      - "user_accounts/signals.py"
      - "user_accounts/tests/test_business_customer_connection.py"
      - "user_accounts/tests/test_technician_handoffs.py"
      - "user_accounts/tests/test_business_technician_groups.py"
      - "user_accounts/models/workforce.py"
      - "sync_ai/workforce_views.py"
      - "sync_ai/urls.py"
      - "user_accounts/viewsets/tickets.py"
      - "user_accounts/viewsets/partner_network.py"
      - "user_accounts/tests/test_subcontractor_signup_invites.py"
      - "user_accounts/viewsets/partner_work_tickets.py"
      - "user_accounts/tests/test_message_permissions.py"
      - ".github/workflows/business-intake-ci.yml"
  pull_request:
    paths:
      - "user_accounts/viewsets/business_quick_intake.py"
      - "user_accounts/urls.py"
      - "user_accounts/tests/test_business_quick_intake.py"
      - "user_accounts/tests/test_business_customer_connection.py"
      - ".github/workflows/business-intake-ci.yml"
  workflow_dispatch:
jobs:
  intake-checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-business-intake-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations user_accounts --check --dry-run
      - run: python manage.py test user_accounts.tests.test_business_quick_intake user_accounts.tests.test_business_customer_connection user_accounts.tests.test_technician_handoffs user_accounts.tests.test_business_technician_groups user_accounts.tests.test_message_permissions user_accounts.tests.test_subcontractor_signup_invites -v 2
