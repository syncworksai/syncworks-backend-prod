name: SyncWorks Household CI

on:
  pull_request:
    paths:
      - "platform_household/**"
      - "platform_social/**"
      - "syncworksv7/settings_pm.py"
      - "syncworksv7/urls.py"
      - ".github/workflows/household-ci.yml"
  workflow_dispatch:

jobs:
  household-checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-household-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify Household migrations
        run: python manage.py makemigrations platform_household --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Household tests
        run: python manage.py test platform_household --verbosity 2
