name: Calendar Connections CI

on:
  pull_request:
    paths:
      - "personal_calendar/**"
      - ".github/workflows/calendar-connections-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test personal_calendar
