name: EDGE v2.0 State Sports

on:
  push:
    branches:
      - agent/edge-v18-basketball-football-golf
    paths:
      - 'scripts/edge_v20_state_sports.py'
      - '.github/workflows/edge-v20-state-sports.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run state-aware basketball and football discovery
        env:
          EDGE_DAYS: '365'
          EDGE_MAX_EVENTS: '300'
        run: python scripts/edge_v20_state_sports.py
      - uses: actions/upload-artifact@v4
        with:
          name: edge-v20-state-sports-results
          path: edge_v20_state_sports_results.json
