name: CEO delegation authorization tests
on:
  pull_request:
    paths:
      - 'user_accounts/models/business.py'
      - 'user_accounts/viewsets/business.py'
      - 'user_accounts/viewsets/team.py'
      - 'user_accounts/services/employees.py'
      - 'user_accounts/permissions.py'
      - 'user_accounts/tests/test_ceo_delegation.py'
      - 'user_accounts/migrations/**'
      - '.github/workflows/ceo-delegation-tests.yml'
  workflow_dispatch:
jobs:
  owner-and-employee-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 'ci-owner-auth-only-not-production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Print proposed migration (no database modification)
        run: python manage.py makemigrations user_accounts --dry-run --verbosity 3
      - name: Owner, HR and tenant isolation regression tests
        run: python manage.py test user_accounts.tests.test_ceo_delegation --verbosity 2
      - name: Enforce no migration drift
        run: python manage.py makemigrations --check --dry-run

  migration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 'ci-migration-plan-only-not-production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Output proposed role migration
        run: python manage.py makemigrations user_accounts --dry-run --verbosity 3
