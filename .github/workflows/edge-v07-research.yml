name: EDGE v0.7 Pregame Holdout Research

on:
  push:
    branches:
      - agent/edge-v07-context-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run EDGE v0.7 pregame baseline + untouched holdout
        env:
          EDGE_DAYS: '20'
        run: python scripts/edge_v07_pregame_holdout.py | tee edge_v07_console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edge-v07-results
          path: |
            edge_v07_results.json
            edge_v07_holdout_sample.json
            edge_v07_console.txt
          retention-days: 14
