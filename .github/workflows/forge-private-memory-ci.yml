name: Forge Private Memory CI

on:
  pull_request:
    paths:
      - "sync_ai/forge_*"
      - "sync_ai/test_forge_*"
      - "sync_ai/urls.py"
      - "customer_health/models.py"
      - "customer_health/migrations/0003_forge_personal_profile.py"
      - ".github/workflows/forge-private-memory-ci.yml"
  workflow_dispatch:

jobs:
  forge-profile:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: forge-ci-secret
      DJANGO_SETTINGS_MODULE: syncworksv7.settings_pm
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations customer_health --check --dry-run
      - run: python manage.py test sync_ai.test_forge_memory sync_ai.test_forge_reflection -v 2
